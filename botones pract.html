<html>
<head>
    <title>Post COVID-19</title>
    <style>
        /* Estilo para el efecto de sustitución al pasar el cursor (Rollover) */
        .img-container {
            position: relative;
            width: 170px;
            height: 60px;
            display: inline-block;
        }
        .img-container img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 4px;
            transition: opacity 0.2s ease-in-out;
        }
        /* La imagen normal está visible por defecto */
        .img-container .img-normal {
            opacity: 1;
        }
        /* La imagen de sustitución está oculta por defecto */
        .img-container .img-sustitucion {
            opacity: 0;
        }
        /* Al pasar el cursor, se invierten las opacidades */
        .img-container:hover .img-normal {
            opacity: 0;
        }
        .img-container:hover .img-sustitucion {
            opacity: 1;
        }
    </style>
</head>
